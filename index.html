<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexham Tourist Guide</title>
    
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Ensure the map takes up the full screen */
        #map {
            width: 100%;
            height: 100vh;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="overflow-hidden m-0 p-0">

    <!-- Top Header / Search Bar & Filters -->
    <header class="absolute top-0 left-0 right-0 z-[1000] p-4 pointer-events-none">
        <div class="max-w-md mx-auto pointer-events-auto space-y-2">
            <!-- Search Input -->
            <input type="text" id="searchInput" placeholder="Search shops, Hexham Abbey..." 
                   class="w-full px-4 py-3 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            
            <!-- Category Filter Pills -->
            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                <button data-category="all" class="filter-btn px-3.5 py-1.5 bg-blue-600 text-white text-xs font-semibold rounded-full shadow-sm whitespace-nowrap transition-colors">All</button>
                <button data-category="History & Heritage" class="filter-btn px-3.5 py-1.5 bg-white/90 backdrop-blur-md text-gray-700 text-xs font-semibold rounded-full shadow-sm border border-gray-200 whitespace-nowrap hover:bg-gray-50 transition-colors">Landmarks</button>
                <button data-category="Food & Drink" class="filter-btn px-3.5 py-1.5 bg-white/90 backdrop-blur-md text-gray-700 text-xs font-semibold rounded-full shadow-sm border border-gray-200 whitespace-nowrap hover:bg-gray-50 transition-colors">Food & Drink</button>
                <button data-category="Shopping" class="filter-btn px-3.5 py-1.5 bg-white/90 backdrop-blur-md text-gray-700 text-xs font-semibold rounded-full shadow-sm border border-gray-200 whitespace-nowrap hover:bg-gray-50 transition-colors">Shopping</button>
            </div>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- App Logic -->
    <script src="js/app.js"></script>

    <!-- Bottom Sheet Modal Component -->
    <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 z-[2000] bg-white rounded-t-3xl shadow-2xl transform translate-y-full transition-transform duration-300 ease-in-out max-w-lg mx-auto border-t border-gray-100">
        <!-- Drag Handle Indicator -->
        <div class="w-full flex justify-center pt-3 pb-1 cursor-pointer" id="closeSheet">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        
        <!-- Sheet Content -->
        <div class="p-6 max-h-[70vh] overflow-y-auto" id="sheetContent">
            <!-- Dynamically populated via JS -->
        </div>
    </div>
</body>
</html>
